# Local Postgres for the bench suite.
#
# Tuned per docs/design/0005-benchmarks.md: we measure driver overhead, not
# WAL fsync — so synchronous_commit=off and fsync=off. autovacuum=off keeps
# the bench-mid-flight quiet (we VACUUM ANALYZE manually in the seed script).
#
# These settings are unsafe for production data — there's no durability.
# Reseed after any container restart.
#
# Port 5433 on the host so this doesn't conflict with a system-installed
# Postgres on the default 5432.

services:
  postgres:
    image: postgres:16
    container_name: pg-rocket-bench
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pgrocket_bench
    ports:
      - "5433:5432"
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - synchronous_commit=off
      - -c
      - fsync=off
      - -c
      - autovacuum=off
      - -c
      - full_page_writes=off
      - -c
      - log_min_messages=warning
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pgrocket_bench"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 1g

volumes:
  pgdata:
